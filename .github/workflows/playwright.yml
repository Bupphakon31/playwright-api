name: Playwright Tests
on:
    push:
        branches: [main, master]
    pull_request:
        branches: [main, master]
    schedule:
        - cron: "30 2 * * 1-5"
jobs:
    test:
        timeout-minutes: 60
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: lts/*
            - name: Install dependencies
              run: npm ci
            - name: Install Playwright Browsers
              run: npx playwright install --with-deps
            - name: Run Playwright tests
              id: run-tests
              run: npx playwright test
            - uses: actions/upload-artifact@v4
              if: ${{ !cancelled() }}
              with:
                  name: playwright-report
                  path: playwright-report/
                  retention-days: 30
            - name: Parse test results
              if: always()
              id: results
              run: |
                  if [ -f test-results.json ]; then
                    echo "passed=$(jq '.stats.expected' test-results.json)" >> $GITHUB_OUTPUT
                    echo "failed=$(jq '.stats.unexpected' test-results.json)" >> $GITHUB_OUTPUT
                    echo "flaky=$(jq '.stats.flaky' test-results.json)" >> $GITHUB_OUTPUT
                    echo "skipped=$(jq '.stats.skipped' test-results.json)" >> $GITHUB_OUTPUT
                    echo "total=$(jq '.stats.expected + .stats.unexpected + .stats.flaky + .stats.skipped' test-results.json)" >> $GITHUB_OUTPUT
                    DURATION_S=$(jq '(.stats.duration / 1000) | floor' test-results.json)
                    if [ "$DURATION_S" -ge 60 ]; then
                      echo "duration=$((DURATION_S / 60))m $((DURATION_S % 60))s" >> $GITHUB_OUTPUT
                    else
                      echo "duration=${DURATION_S}s" >> $GITHUB_OUTPUT
                    fi
                    FAILED_TESTS=$(jq -r '[.. | objects | select(has("ok") and (.ok == false)) | .title] | unique | map("• " + .) | join("<br>")' test-results.json)
                    if [ -n "$FAILED_TESTS" ]; then
                      {
                        echo "failed_section<<DELIM"
                        printf '<tr><td style="padding:0 28px 20px;"><p style="font-size:12px;font-weight:700;color:#DC2626;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:8px;">Failed Tests</p><p style="font-size:13px;color:#374151;line-height:1.8;">%s</p></td></tr>' "$FAILED_TESTS"
                        printf '\n'
                        echo "DELIM"
                      } >> $GITHUB_OUTPUT
                    else
                      echo "failed_section=" >> $GITHUB_OUTPUT
                    fi
                    FLAKY_TESTS=$(jq -r '[.. | objects | select(has("tests")) | select(any(.tests[]; .status == "flaky")) | .title] | unique | map("• " + .) | join("<br>")' test-results.json)
                    if [ -n "$FLAKY_TESTS" ]; then
                      {
                        echo "flaky_section<<DELIM"
                        printf '<tr><td style="padding:0 28px 20px;"><p style="font-size:12px;font-weight:700;color:#D97706;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:8px;">Flaky Tests</p><p style="font-size:13px;color:#374151;line-height:1.8;">%s</p></td></tr>' "$FLAKY_TESTS"
                        printf '\n'
                        echo "DELIM"
                      } >> $GITHUB_OUTPUT
                    else
                      echo "flaky_section=" >> $GITHUB_OUTPUT
                    fi
                  else
                    echo "passed=N/A" >> $GITHUB_OUTPUT
                    echo "failed=N/A" >> $GITHUB_OUTPUT
                    echo "flaky=N/A" >> $GITHUB_OUTPUT
                    echo "skipped=N/A" >> $GITHUB_OUTPUT
                    echo "total=N/A" >> $GITHUB_OUTPUT
                    echo "duration=N/A" >> $GITHUB_OUTPUT
                    echo "failed_section=" >> $GITHUB_OUTPUT
                    echo "flaky_section=" >> $GITHUB_OUTPUT
                  fi
            - name: Determine test status
              if: always()
              id: status
              run: |
                  if [ "${{ steps.run-tests.outcome }}" == "success" ]; then
                    echo "color=#16A34A" >> $GITHUB_OUTPUT
                    echo "icon=&#10003;" >> $GITHUB_OUTPUT
                    echo "label=All Tests Passed" >> $GITHUB_OUTPUT
                    echo "emoji=✅" >> $GITHUB_OUTPUT
                  else
                    echo "color=#DC2626" >> $GITHUB_OUTPUT
                    echo "icon=&#10005;" >> $GITHUB_OUTPUT
                    echo "label=Tests Failed" >> $GITHUB_OUTPUT
                    echo "emoji=❌" >> $GITHUB_OUTPUT
                  fi
                  echo "short_sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
                  case "${{ github.event_name }}" in
                    schedule) echo "trigger=Scheduled" >> $GITHUB_OUTPUT ;;
                    pull_request) echo "trigger=Pull Request" >> $GITHUB_OUTPUT ;;
                    *) echo "trigger=Push" >> $GITHUB_OUTPUT ;;
                  esac
            - name: Send mail
              if: always()
              uses: dawidd6/action-send-mail@v3
              with:
                  server_address: smtp.gmail.com
                  server_port: 465
                  username: ${{ secrets.GMAIL_USERNAME }}
                  password: ${{ secrets.GMAIL_PASSWORD }}
                  subject: "${{ steps.status.outputs.emoji }} [${{ github.event.repository.name }}] ${{ steps.results.outputs.passed }} passed, ${{ steps.results.outputs.failed }} failed | ${{ github.ref_name }}"
                  to: ${{ secrets.GMAIL_USERNAME }}
                  from: Playwright CI
                  html_body: |
                      <!DOCTYPE html>
                      <html lang="en">
                      <head>
                      <meta charset="UTF-8">
                      <style>
                        body, table, td { font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
                        body { margin:0; padding:0; background-color:#F3F4F6; }
                        p { line-height:1.55; margin:0; }
                        .mono { font-family:'SF Mono','Roboto Mono',Consolas,'Courier New',monospace; }
                        .chip { display:inline-block; font-size:12px; color:#374151; background-color:#F3F4F6; border-radius:5px; padding:5px 11px; margin:0 6px 6px 0; }
                      </style>
                      </head>
                      <body>
                      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#F3F4F6; padding:32px 0;">
                      <tr><td align="center">
                      <table role="presentation" width="560" cellpadding="0" cellspacing="0" style="width:560px; max-width:560px; background-color:#FFFFFF; border-radius:10px; overflow:hidden; box-shadow:0 1px 4px rgba(0,0,0,0.08);">

                        <tr>
                          <td style="background-color:${{ steps.status.outputs.color }}; padding:24px 28px;">
                            <p style="color:#FFFFFF; font-size:21px; font-weight:700;">${{ steps.status.outputs.icon }}&nbsp; ${{ steps.status.outputs.label }}</p>
                            <p style="color:#FFFFFF; opacity:0.85; font-size:13px; margin-top:4px;">${{ github.repository }}</p>
                          </td>
                        </tr>

                        <tr>
                          <td style="padding:24px 28px 12px;">
                            <p style="font-size:12px; font-weight:700; color:#6B7280; text-transform:uppercase; letter-spacing:0.06em; margin-bottom:12px;">Run Details</p>
                            <span class="chip">Branch: ${{ github.ref_name }}</span>
                            <span class="chip mono">${{ steps.status.outputs.short_sha }}</span>
                            <span class="chip">${{ github.actor }}</span>
                            <span class="chip">${{ steps.status.outputs.trigger }}</span>
                            <span class="chip">⏱ ${{ steps.results.outputs.duration }}</span>
                          </td>
                        </tr>

                        <tr>
                          <td style="padding:0 28px 24px;">
                            <table width="100%" cellpadding="0" cellspacing="0">
                              <tr>
                                <td align="center" style="padding:14px 8px; background:#F0FDF4; border-radius:8px; width:23%;">
                                  <p style="font-size:24px; font-weight:700; color:#16A34A; margin:0;">${{ steps.results.outputs.passed }}</p>
                                  <p style="font-size:11px; color:#6B7280; margin-top:2px;">Passed</p>
                                </td>
                                <td width="3%"></td>
                                <td align="center" style="padding:14px 8px; background:#FEF2F2; border-radius:8px; width:23%;">
                                  <p style="font-size:24px; font-weight:700; color:#DC2626; margin:0;">${{ steps.results.outputs.failed }}</p>
                                  <p style="font-size:11px; color:#6B7280; margin-top:2px;">Failed</p>
                                </td>
                                <td width="3%"></td>
                                <td align="center" style="padding:14px 8px; background:#FFFBEB; border-radius:8px; width:23%;">
                                  <p style="font-size:24px; font-weight:700; color:#D97706; margin:0;">${{ steps.results.outputs.flaky }}</p>
                                  <p style="font-size:11px; color:#6B7280; margin-top:2px;">Flaky</p>
                                </td>
                                <td width="3%"></td>
                                <td align="center" style="padding:14px 8px; background:#F9FAFB; border-radius:8px; width:23%;">
                                  <p style="font-size:24px; font-weight:700; color:#6B7280; margin:0;">${{ steps.results.outputs.skipped }}</p>
                                  <p style="font-size:11px; color:#6B7280; margin-top:2px;">Skipped</p>
                                </td>
                              </tr>
                            </table>
                          </td>
                        </tr>

                        ${{ steps.results.outputs.failed_section }}

                        ${{ steps.results.outputs.flaky_section }}

                        <tr><td style="padding:0 28px;"><hr style="border:none; border-top:1px solid #E5E7EB;"></td></tr>

                        <tr>
                          <td style="padding:24px 28px;">
                            <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                               style="display:inline-block; background-color:#1F2937; color:#FFFFFF; font-size:13px; font-weight:600; text-decoration:none; padding:12px 20px; border-radius:7px;">
                               View Run on GitHub
                            </a>
                          </td>
                        </tr>

                        <tr>
                          <td style="padding:16px 28px; background-color:#F9FAFB;">
                            <p style="font-size:11px; color:#9CA3AF;">Automated notification from GitHub Actions</p>
                          </td>
                        </tr>

                      </table>
                      </td></tr>
                      </table>
                      </body>
                      </html>
